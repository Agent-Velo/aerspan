# Aerspan multi-domain deployment with Traefik (Docker Compose)
#
# Quick start:
#   1) Copy .env.example -> .env and adjust values (especially passwords/domains)
#   2) docker compose -f docker-compose.traefik.yml up -d --build
#
# Default local domains (override in .env):
#   - Admin UI:  ${WEB_DOMAIN:-admin.localhost}
#   - User UI:   ${WEB_V2_DOMAIN:-app.localhost}
#   - REST API:  ${API_DOMAIN:-api.localhost}     (serves /api)
#   - LLM API:   ${LLM_DOMAIN:-llm.localhost}     (serves /v1, /v1beta, ...)
#
# Notes:
# - This file does NOT replace docker-compose.yml (keep it for simple single-container access on :3000).
# - This compose file is STRICT by default: UI domains serve static assets only.

version: '3.4'

services:
  traefik:
    image: traefik:v2.11
    container_name: aerspan-traefik
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=aerspan-traefik
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=${LETSENCRYPT_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      # Local debug only (optional):
      # - --api.dashboard=true
      # - --api.insecure=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      # - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - traefik

  web:
    build:
      context: ./web
      args:
        VITE_REACT_APP_SERVER_URL: "${VITE_REACT_APP_SERVER_URL:-}"
    image: aerspan/web:local
    container_name: aerspan-web
    restart: always
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aerspan-web.rule=Host(`${WEB_DOMAIN:-admin.localhost}`)"
      - "traefik.http.routers.aerspan-web.entrypoints=websecure"
      - "traefik.http.routers.aerspan-web.tls=true"
      - "traefik.http.routers.aerspan-web.tls.certresolver=le"
      - "traefik.http.routers.aerspan-web.priority=1"
      - "traefik.http.services.aerspan-web.loadbalancer.server.port=80"

  web-v2:
    build:
      context: ./web-v2
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        VITE_REACT_APP_SERVER_URL: "${VITE_REACT_APP_SERVER_URL:-}"
    image: aerspan/web-v2:local
    container_name: aerspan-web-v2
    restart: always
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aerspan-webv2.rule=Host(`${WEB_V2_DOMAIN:-app.localhost}`)"
      - "traefik.http.routers.aerspan-webv2.entrypoints=websecure"
      - "traefik.http.routers.aerspan-webv2.tls=true"
      - "traefik.http.routers.aerspan-webv2.tls.certresolver=le"
      - "traefik.http.routers.aerspan-webv2.priority=1"
      - "traefik.http.services.aerspan-webv2.loadbalancer.server.port=80"

  new-api:
    build:
      context: .
    image: aerspan/new-api:local
    container_name: aerspan-new-api
    restart: always
    command: --log-dir /app/logs
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # ⚠️ IMPORTANT: Change passwords before deploying to production!
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      # Optional cross-domain support (see .env.example)
      - SESSION_SECRET=${SESSION_SECRET:-}
      - CRYPTO_SECRET=${CRYPTO_SECRET:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\\\"success\\\":\\\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - traefik
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.aerspan-api.loadbalancer.server.port=3000"

      # Dedicated REST API domain (management): /api
      - "traefik.http.routers.aerspan-api.rule=Host(`${API_DOMAIN:-api.localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/pg`))"
      - "traefik.http.routers.aerspan-api.entrypoints=websecure"
      - "traefik.http.routers.aerspan-api.priority=100"
      - "traefik.http.routers.aerspan-api.service=aerspan-api"
      - "traefik.http.routers.aerspan-api.tls=true"
      - "traefik.http.routers.aerspan-api.tls.certresolver=le"

      # Dedicated LLM relay domain: /v1, /v1beta, /mj, /suno, /kling, /jimeng, /dashboard ...
      - "traefik.http.routers.aerspan-llm.rule=Host(`${LLM_DOMAIN:-llm.localhost}`) && (PathPrefix(`/v1`) || PathPrefix(`/mj`) || PathPrefix(`/suno`) || PathPrefix(`/kling`) || PathPrefix(`/jimeng`) || PathPrefix(`/dashboard`) || PathRegexp(`^/[^/]+/mj`))"
      - "traefik.http.routers.aerspan-llm.entrypoints=websecure"
      - "traefik.http.routers.aerspan-llm.priority=100"
      - "traefik.http.routers.aerspan-llm.service=aerspan-api"
      - "traefik.http.routers.aerspan-llm.tls=true"
      - "traefik.http.routers.aerspan-llm.tls.certresolver=le"

  redis:
    image: redis:latest
    container_name: aerspan-redis
    restart: always
    networks:
      - backend

  postgres:
    image: postgres:15
    container_name: aerspan-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  pg_data:
  traefik_letsencrypt:

networks:
  traefik:
    name: aerspan-traefik
  backend:
    name: aerspan-backend
